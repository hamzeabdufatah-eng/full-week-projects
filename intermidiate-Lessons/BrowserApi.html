<!doctype html>
<html>
  <head> </head>
  <body>
    <h1 id="msg">0</h1>
    <button id="btn">start</button>
    <button id="bt">stop</button>
    <!-- <p id="width"></p>
    <!-- <p id="heigth"></p> -->
    <p id="url"></p>
    <script>
      // const width=document.getElementById("width");
      // const heigth=document.getElementById("heigth");
      // const url=document.getElementById("url");
      // width.textContent=`width:`+window.innerWidth;
      // heigth.textContent=`heigth:`+window.innerHeight;
      // url.textContent=`url:`+window.location.href
      // setTimeout(()=>{
      //     console.log("hello-hamza")
      // },3000)
      const count = document.getElementById("msg");
      const start = document.getElementById("btn");
      const stop = document.getElementById("bt");
      let number = 0;
      let timer;
      start.addEventListener("click",()=>{
        timer=setInterval(()=>{
            number++;
            count.textContent=number
        },1000)
      });
      stop.addEventListener("click",()=>{
        clearInterval(timer)
      })
    </script>
  </body>
</html>
