     <p id="date"></p>

<script>

// 
   let count = 0;
    const display = document.getElementById("display");
    const cunt = document.getElementById("c").addEventListener("click", () => {
      count++;
      display.innerText = count;
    });
// 
    document.getElementById("reset").addEventListener("click", () => {
      if (count > 0) {
        count--;
        display.innerText = count;
      }
    });
  const input = document.getElementById("input");
  input.addEventListener("input", (eent) => {
    document.getElementById("msg").innerText = eent.target.value;
  });

    counter++;
    document.getElementById("counter").innerText=counter
// 
    if(counter>=5){
        clearInterval(intervalid)
     alert("counter passed at 5")
    }
  }, 1000);

  browser objects
    document.getElementById(`Url`).innerText=window.location.href
    document.getElementById("browser").innerText=navigator.userAgent
// 
  document.getElementById("forward").addEventListener("click",function(){
    window.history.forward()
  })
  document.getElementById("back").addEventListener("click",function(){
    window.history.back()
  })
  let lesson1=1
  document.getElementById("forward").addEventListener("click",function(){

    document.getElementById("page").innerText="lesson"+lesson1+"more"

  })
