<!doctype html>
<html lang="e">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"content="width=device-width",initial-scale="1.0" />
    <title>Mahuraan Gym</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- header -->
    <header>
      <div class="logo">Mahuraan Gym</div>
      <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Contact</a>
      </nav>
      <div class="header-actions">
        <input type="text" id="searchInput" placeholder="Search Products" />
        <button id="cartButton">Cart(<span id="cartCount">0</span>)</button>
        <button id="accountButton">Account</button>
      </div>
    </header>
    <!-- Main Content -->
    <main>
      <!-- hero -->
      <section class="hero">
        <div class="hero-content">
          <h1>Premium Gym Equipment</h1>
          <p>
            Upgrade your fitness with high quality gym equipment for home and
            commercial use.
          </p>
          <button>Shop Now</button>
        </div>
      </section>
      <!-- Categoreis -->
      <section class="categories">
        <h2>Shop By Category</h2>
        <div class="category-grid">
          <div class="category-card">
            <h3>Dumbbells</h3>
          </div>
          <div class="category-card">
            <h3>Barbells</h3>
          </div>
          <div class="category-card">
            <h3>Benches</h3>
          </div>
          <div class="category-card">
            <h3>Machines</h3>
          </div>
          <div class="category-card">
            <h3>Cardio</h3>
          </div>
          <div class="category-card">
            <h3>Accessories</h3>
          </div>
        </div>
      </section>
      <!-- Featured Products -->
      <section class="products">
        <h2>Featured Products</h2>
        <div id="productsContainer">
          <!--js ayaa kaa products-ka halkan gelin doonta  -->
        </div>
      </main>
      <!-- Cart Panel -->
       <div id="cartPanel" class="cart-panel">
        <div class="cart-header">
          <h2>Your Cart</h2>
          <button id="closeCart">x</button>
        </div>
        <div id="cartItems">
          <!-- cart Productons display -->
           </div>
           <div class="cart-footer">
          <h3>Total<span id="cartTotal">0</span>ETB</h3>
          <button id="checkoutButton">Checkout</button>
           </div>
       </div>
    <!-- Java Script -->
     <script src="script.js"></script>
  </body>
</html>
